name: Test

on:
  pull_request:
    branches: [dev, main]
    paths: ["apps/**"]
  push:
    branches: [dev, main]
    paths: ["apps/**"]

jobs:
  discover-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          MATRIX=$(find apps -mindepth 1 -maxdepth 1 -type d ! -name template -printf '%p\n' \
            | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test-all:
    needs: discover-apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: tests
        working-directory: ${{ matrix.app }}
        run: |
          uv sync
          uv run pytest -v
