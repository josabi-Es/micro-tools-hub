name: CI

on:
  pull_request:
    branches: [dev, main]
    paths: ["apps/**"]
  push:
    branches: [dev, main]
    paths: ["apps/**"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: tj-actions/changed-files@v42
        with:
          dir_names: true
          dir_names_max_depth: 2
          files: apps/**
      - id: set-matrix
        run: |
          MATRIX=$(echo '${{ steps.changed.outputs.all_changed_files }}' \
            | tr ' ' '\n' \
            | grep -E '^apps/[^/]+$' \
            | grep -v '^apps/template$' \
            | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  lint-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        working-directory: ${{ matrix.app }}
        run: uvx ruff check .
      - name: ruff format check
        working-directory: ${{ matrix.app }}
        run: uvx ruff format --check .
      - name: tests
        working-directory: ${{ matrix.app }}
        run: |
          uv sync
          uv run pytest -v

  bump-version:
    needs: detect-changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: bump versions for changed apps
        run: |
          for app in $(echo '${{ needs.detect-changes.outputs.matrix }}' | jq -r '.[]'); do
            git log "${{ github.event.pull_request.base.sha }}..HEAD" --pretty=%s -- "$app" \
              | python versioning/auto_version.py "$app"
          done
      - name: commit bump
        run: |
          if git diff --quiet; then
            echo "No version bump needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/*/manifest.json
          git commit -m "chore: bump app versions [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
