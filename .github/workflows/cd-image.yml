name: Image

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  pull_request:
    branches: [main]
    paths: ["apps/**"]
    types: [closed]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: tj-actions/changed-files@v42
        with:
          dir_names: true
          dir_names_max_depth: 2
          files: apps/**
      - id: set-matrix
        run: |
          MATRIX=$(echo '${{ steps.changed.outputs.all_changed_files }}' \
            | tr ' ' '\n' \
            | grep -E '^apps/[^/]+$' \
            | grep -v '^apps/template$' \
            | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    env:
      MAX_IMAGE_MB: 500
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "repo=$(jq -r .docker_repo ${{ matrix.app }}/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version ${{ matrix.app }}/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          load: true
          tags: ${{ steps.meta.outputs.repo }}:latest
      - name: check image size
        run: |
          SIZE_MB=$(( $(docker image inspect ${{ steps.meta.outputs.repo }}:latest \
            --format '{{.Size}}') / 1024 / 1024 ))
          echo "Image size: ${SIZE_MB}MB (limit ${MAX_IMAGE_MB}MB)"
          if [ "$SIZE_MB" -gt "$MAX_IMAGE_MB" ]; then
            echo "::error::Image is ${SIZE_MB}MB, over the ${MAX_IMAGE_MB}MB limit. Not publishing."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:latest
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
